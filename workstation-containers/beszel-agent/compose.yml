services:
  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: always
    network_mode: host
    user: "1000:1000"
    security_opt:
      - label=disable
    volumes:
      - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro,z
      - ./beszel_agent_data:/var/lib/beszel-agent:z
    environment:
      LISTEN: 45876
      KEY: ${KEY}
      TOKEN: ${TOKEN}
      HUB_URL: http://192.168.0.38:8090
