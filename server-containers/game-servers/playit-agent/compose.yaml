services:
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    container_name: playit-tunnel
    restart: unless-stopped

    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY}

    networks:
      - game-tunnel

    healthcheck:
      test: ["CMD-SHELL", "test -d /proc/1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  game-tunnel:
    name: game-tunnel
    driver: bridge
